name: Deploy Frontend (Quasar -> VPS)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install sshpass + rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist via rsync
        run: |
          # If your output is dist/spa, change source to dist/spa/
          SRC_DIR="dist/"
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            "$SRC_DIR" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/chat-frontend/"

      - name: Reload nginx
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo nginx -t && sudo systemctl reload nginx"
